[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yahtzee-montecarlo"
version = "1.0.0"
description = "Simulacion Montecarlo del juego de Yahtzee para dos jugadores"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesus Gonzalez" }]
keywords = ["montecarlo", "simulacion", "yahtzee", "probabilidad"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
figuras = ["matplotlib>=3.8"]
dev = ["ruff>=0.6", "matplotlib>=3.8"]

[project.scripts]
yahtzee = "yahtzee.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
